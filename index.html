<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Todo</title>
  <meta name="application-name" content="Todo">
  <meta name="apple-mobile-web-app-title" content="Todo">
  <meta name="theme-color" content="#333333">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --stroke: 1.5px; --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    html, body, button, input, textarea, select { font-family: var(--font); }
    .ico { display: block; fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
    .ico path { vector-effect: non-scaling-stroke; }
    .hidden { display: none; }
    body.has-nav { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
    #bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; background: #fff; border-top: 1px solid #e5e7eb; padding-bottom: env(safe-area-inset-bottom, 0px); }
    #bottom-nav.hidden { display: none; }
    #bottom-nav button { flex: 1; height: 56px; padding: 0; background: none; border: none; font-size: 14px; color: #9ca3af; cursor: pointer; }
    #bottom-nav button.active { color: #000; font-weight: 600; }
    .req { color: #ef4444; }
    .menu-wrap { position: fixed; top: 12px; right: 12px; z-index: 10; }
    #menu-btn, #detail-menu-btn { width: 32px; height: 32px; padding: 0; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #mini-menu, #detail-mini-menu { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid #ccc; border-radius: 6px; white-space: nowrap; }
    #mini-menu.open, #detail-mini-menu.open { display: block; }
    #mini-menu button, #detail-mini-menu button { display: block; width: 100%; padding: 8px 14px; background: none; border: none; text-align: left; cursor: pointer; }
    #fab { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; border: none; background: #333; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .sheet { position: fixed; z-index: 15; inset: 0; background: rgba(0,0,0,0); display: flex; align-items: flex-end; justify-content: center; visibility: hidden; transition: background 0.3s ease, visibility 0s linear 0.3s; }
    .sheet.open { background: rgba(0,0,0,0.4); visibility: visible; transition: background 0.3s ease, visibility 0s; }
    .sheet .modal-box { max-height: 90vh; overflow-y: auto; background: #fff; width: 100%; max-width: 600px; box-sizing: border-box; border-radius: 16px 16px 0 0; padding: 24px 20px 32px; transform: translateY(100%); transition: transform 0.3s ease; }
    .sheet.open .modal-box { transform: translateY(0); }
    .modal-box label { display: block; margin-bottom: 6px; font-size: 14px; }
    .modal-box input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 16px; }
    .cat-icon { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; }
    .cat-icon .ico { stroke-width: 2; }
    #icon-picker { display: flex; gap: 8px; margin-bottom: 20px; }
    .icon-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; font-size: 11px; font-family: inherit; color: #6b7280; cursor: pointer; }
    .icon-opt .ico { stroke-width: 1.8; }
    .icon-opt.selected { border-color: #333; background: #f3f4f6; color: #333; }
    #palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.selected { border-color: #333; }
    .sync-row { display: flex; gap: 8px; }
    .sync-row button { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #333; color: #fff; font-size: 15px; font-family: inherit; cursor: pointer; }
    .sync-row button:disabled { background: #d1d5db; cursor: default; }
    #sync-status { margin: 12px 0 0; font-size: 12px; color: #6b7280; text-align: center; min-height: 16px; }
    #save-btn, #todo-save-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
    #category-list, #done-cat-list { list-style: none; margin: 0; padding: 16px; }
    #category-list li, #done-cat-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    #done-cat-list li.empty { color: #6b7280; font-size: 14px; justify-content: center; padding: 24px 0; }
    #category-list li { cursor: pointer; }
    .action-btn { display: block; width: 100%; padding: 14px; background: none; border: none; text-align: left; font-size: 16px; cursor: pointer; }
    .action-btn.danger { color: #ef4444; }
    .confirm-msg { margin: 0 0 20px; font-size: 16px; text-align: center; }
    .confirm-row { display: flex; gap: 10px; }
    .confirm-row button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    #confirm-cancel, #todo-confirm-cancel, #archive-confirm-cancel { background: #e5e7eb; color: #333; }
    #confirm-ok, #todo-confirm-ok, #archive-confirm-ok { background: #ef4444; color: #fff; }
    #search-input { flex: 1; min-width: 0; margin: 0 8px 0 4px; padding: 9px 12px; border: none; border-radius: 8px; background: #f3f4f6; font-size: 16px; font-family: inherit; outline: none; box-sizing: border-box; }
    .sr-item { padding: 12px 20px; border-bottom: 1px solid #f0f0f0; }
    .sr-head { display: flex; align-items: center; gap: 8px; }
    .sr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .sr-title { font-size: 15px; font-weight: 600; }
    .sr-tag { font-size: 11px; color: #6b7280; background: #f3f4f6; border-radius: 4px; padding: 1px 6px; }
    .sr-count { margin: 4px 0 8px 18px; font-size: 12px; color: #6b7280; }
    .sr-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 18px; }
    .sr-date { cursor: pointer; font-size: 12px; padding: 3px 8px; border-radius: 12px; background: #f3f4f6; color: #333; }
    .sr-date.done { text-decoration: line-through; color: #9ca3af; }
    .sr-empty { padding: 24px 20px; font-size: 14px; color: #6b7280; text-align: center; }
    #undo-toast { position: fixed; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); z-index: 30; display: none; align-items: center; gap: 14px; max-width: 90%; box-sizing: border-box; padding: 10px 14px; border-radius: 8px; background: #333; color: #fff; font-size: 14px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    #undo-toast.show { display: flex; }
    #undo-toast button { background: none; border: none; padding: 2px 0; color: #93c5fd; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
    #move-undone-wrap { padding: 16px 20px 24px; }
    #move-undone-btn { background: none; border: none; padding: 6px 0; font-size: 14px; font-family: inherit; color: #6b7280; cursor: pointer; }
    #move-undone-wrap.hidden { display: none; }
    .page-header { display: flex; align-items: center; height: 56px; padding: 0 8px; border-bottom: 1px solid #e5e7eb; }
    #back-btn, #archive-back-btn, #search-back-btn, #done-cat-back-btn { width: 40px; height: 40px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    #calendar { min-height: 50vh; transition: min-height 0.3s ease; box-sizing: border-box; padding: 4px 16px 12px; display: flex; flex-direction: column; }
    .cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px; }
    .main-head { position: sticky; top: 0; z-index: 8; background: #fff; margin: -8px -8px 0; padding: 12px 24px 8px; }
    #calendar { padding-top: 0; min-height: calc(50vh - 44px); }
    #calendar.collapsed { min-height: 0; }
    .cal-head button { background: none; border: none; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    #cal-title, #tl-title, #record-title { font-size: 18px; font-weight: 600; line-height: 32px; min-width: 110px; text-align: center; cursor: pointer; }
    #tl-grid { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 24px; }
    .tl-row { display: flex; align-items: center; }
    .tl-hour { width: 28px; flex-shrink: 0; font-size: 12px; color: #6b7280; }
    .tl-cells { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); justify-items: center; }
    .tl-cell { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { touch-action: pan-x pan-y; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    #tl-grid button:focus { outline: none; }
    #tl-grid { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tl-cell.sel { background: #d1d5db; }
    #tl-range { margin: 0 0 20px; font-size: 18px; font-weight: 600; text-align: center; }
    .assign-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 0; background: none; border: none; text-align: left; font-size: 15px; cursor: pointer; }
    .tl-cell { position: relative; }
    .tl-mins { position: absolute; inset: 0; display: flex; border-radius: 50%; overflow: hidden; }
    .tl-min { flex: 1; }
    .tl-cell::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 var(--stroke) #d1d5db; pointer-events: none; }
    .tl-cell.has::after { box-shadow: inset 0 0 0 var(--stroke) var(--cc, #4b5563); }
    .tl-cell.has .tl-min { background: transparent; }
    .tl-cell.has .tl-min.past { background: var(--cc); }
    .tl-min.past { background: #e5e7eb; }
    .tl-cell.sel .tl-min.past { background: #d1d5db; }
    .tl-cell.sel .tl-min { background: #d1d5db; }
    .tl-cell.has.sel .tl-min, .tl-cell.has.sel .tl-min.past { background: #d1d5db; }
    .tl-badge { z-index: 1; position: absolute; top: -4px; right: -4px; min-width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; border: none; padding: 0 3px; background: #4b5563; color: #fff; font-size: 8px; line-height: 12px; text-align: center; white-space: nowrap; cursor: pointer; box-shadow: 0 0 0 1px #fff; }
    #tl-cell-range { margin: 0 0 12px; font-size: 18px; font-weight: 600; text-align: center; }
    .assign-cancel { flex-shrink: 0; margin-left: 4px; padding: 4px 8px; background: none; border: none; font-size: 13px; color: #ef4444; cursor: pointer; }
    #tl-assigned { margin-bottom: 16px; }
    .assign-check { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; }
    #tl-assign-btn { width: 100%; margin-top: 16px; padding: 10px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
    #tl-assign-btn:disabled { background: #d1d5db; cursor: default; }
    .assign-item .assign-time { margin-left: auto; font-size: 12px; color: #6b7280; }
    .assign-item .done { text-decoration: line-through; }
    .assign-empty { padding: 12px 0; font-size: 14px; color: #6b7280; }
    #sleep-btn, #diary-save-btn { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #sleep-popup .popup-box { padding: 20px 16px; }
    #sleep-sub { margin: -10px 0 16px; font-size: 12px; color: #6b7280; text-align: center; }
    .sleep-title { margin: 0 0 16px; font-size: 18px; font-weight: 600; text-align: center; }
    .sleep-pair { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .sleep-item { display: flex; align-items: center; gap: 8px; }
    .sleep-item span { font-size: 14px; white-space: nowrap; }
    #sleep-popup input[type="text"] { width: 72px; box-sizing: border-box; padding: 8px; text-align: center; font-family: inherit; }
    .sleep-row { display: flex; gap: 10px; }
    .sleep-row button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    #sleep-save { background: #333; color: #fff; }
    #sleep-clear { background: #e5e7eb; color: #333; }
    .tl-min.sleep { background: #d1d5db; }
    .tl-head { position: sticky; top: 0; z-index: 8; background: #fff; display: flex; align-items: center; justify-content: center; height: 32px; margin: -8px -8px 8px; padding: 12px 24px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .cal-week { font-size: 12px; color: #6b7280; padding-bottom: 6px; }
    #cal-days { flex: 1; grid-auto-rows: 1fr; align-items: center; }
    .cal-day { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: 0 auto; border-radius: 50%; font-size: 14px; }
    .cal-day { cursor: pointer; box-sizing: border-box; padding-top: 3.5px; }
    #cal-days .cal-day { position: relative; }
    .cal-badge { position: absolute; top: -4px; right: -4px; min-width: 12px; height: 12px; padding: 0 2px; box-sizing: border-box; border-radius: 6px; background: #4b5563; color: #fff; font-size: 8px; line-height: 12px; text-align: center; pointer-events: none; box-shadow: 0 0 0 1px #fff; }
    .cal-day.selected { background: #d1d5db; color: #000; }
    .cal-day.today { background: #000; color: #fff; }
    #calendar.collapsed { min-height: 0; }
    #collapse-btn .arrow { display: inline-block; transform: rotate(90deg); transition: transform 0.3s ease; }
    #calendar.collapsed #collapse-btn .arrow { transform: rotate(270deg); }
    #collapse-btn { align-self: center; background: none; border: none; width: 32px; height: 32px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
    #main-categories { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
    .cat-pill { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border: 1px solid #e5e7eb; border-radius: 999px; background: #e5e7eb; }
    .cat-pill .cat-name { flex: 1; font-size: 15px; }
    .cat-plus { width: 28px; height: 28px; border-radius: 50%; border: none; background: #fff; color: #000; cursor: pointer; padding: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .modal-box textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 20px; min-height: 90px; resize: none; font-family: inherit; }
    #memo-collapse textarea { margin-bottom: 0; margin-top: 8px; }
    .cat-group { display: flex; flex-direction: column; }
    .todo-item { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; display: flex; align-items: flex-start; gap: 10px; padding: 8px 16px 8px 20px; cursor: pointer; }
    .todo-item.dragging { background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.18); border-radius: 8px; position: relative; z-index: 5; }
    .todo-check { width: 20px; height: 20px; border-radius: 50%; border: none; box-shadow: inset 0 0 0 var(--stroke) #333; background: transparent; padding: 0; flex-shrink: 0; cursor: pointer; box-sizing: border-box; }
    .todo-title.done { text-decoration: line-through; }
    .todo-title { font-size: 14px; line-height: 20px; }
    .todo-time { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .todo-memo { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .time-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-box .time-head label { margin-bottom: 0; }
    .switch { width: 40px; height: 24px; border-radius: 12px; border: none; background: #d1d5db; position: relative; cursor: pointer; padding: 0; transition: background 0.2s ease; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s ease; }
    .switch.on { background: #333; }
    .switch.on::after { transform: translateX(16px); }
    .time-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; margin-bottom: 20px; }
    .time-collapse.open { grid-template-rows: 1fr; }
    .time-collapse > div { overflow: hidden; min-height: 0; }
    .time-collapse:not(.open) > div { visibility: hidden; }
    .time-pair { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 10px; }
    .time-item { display: flex; align-items: center; gap: 8px; }
    .time-item span { font-size: 14px; white-space: nowrap; }
    .modal-box .time-item input[type="text"] { width: 72px; margin-bottom: 0; text-align: center; }
    .time-warn { margin: 8px 0 0; font-size: 12px; color: #ef4444; }
    .time-warn:empty { display: none; }
    .repeat-days { display: flex; justify-content: space-between; margin: 8px 0 12px; }
    .day-chip { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d1d5db; background: #fff; color: #333; font-size: 14px; padding: 0; cursor: pointer; }
    .day-chip.selected { background: #333; border-color: #333; color: #fff; }
    .repeat-until { display: flex; align-items: center; justify-content: space-between; }
    .repeat-until span { font-size: 14px; }
    .modal-box .repeat-until input[type="text"] { width: 140px; margin-bottom: 0; padding: 8px; text-align: center; cursor: pointer; font-family: inherit; }
    .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 20; }
    .popup.open { display: flex; }
    .popup-box { background: #fff; border-radius: 12px; padding: 16px; width: 300px; max-width: 90%; box-sizing: border-box; }
    #pop-title { font-size: 18px; font-weight: 600; min-width: 110px; text-align: center; }
    .popup-days { grid-auto-rows: 40px; align-items: center; }
    .cal-day.disabled { color: #d1d5db; cursor: default; }
    #pop-confirm { display: none; width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 6px; background: #333; color: #fff; font-size: 15px; font-family: inherit; cursor: pointer; }
    #pop-confirm.show { display: block; }
    #pop-confirm:disabled { background: #d1d5db; color: #fff; cursor: default; }
    .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
    .tl-cell.sel { background: #000; }
    .tl-cell.sel .tl-min, .tl-cell.sel .tl-min.past, .tl-cell.sel .tl-min.sleep,
    .tl-cell.has.sel .tl-min, .tl-cell.has.sel .tl-min.past { background: #000; }
    .tl-cell.sel::after, .tl-cell.has.sel::after { box-shadow: inset 0 0 0 var(--stroke) #000; }
    .tl-cell::before { content: attr(data-time); position: absolute; inset: 0; z-index: 1; display: none; align-items: center; justify-content: center; color: #fff; font-size: 8px; font-weight: 600; letter-spacing: -0.3px; line-height: 1; pointer-events: none; }
    .tl-cell.sel::before { display: flex; }
  </style>
</head>
<body class="has-nav">
  <div id="main-view">
    <div class="menu-wrap">
      <button id="menu-btn" aria-label="메뉴"><svg class="ico" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M.75 .75h14.5M.75 6h14.5M.75 11.25h14.5"/></svg></button>
      <div id="mini-menu">
        <button type="button" id="category-btn">카테고리 설정</button>
        <button type="button" id="archive-btn">보관함</button>
        <button type="button" id="search-btn">검색</button>
        <button type="button" id="save-img-btn">이미지로 저장</button>
        <button type="button" id="sync-btn">동기화</button>
      </div>
    </div>

    <div class="cal-head main-head">
      <button type="button" id="cal-prev" aria-label="이전 달"><svg class="ico" width="6" height="9" viewBox="0 0 6 9" aria-hidden="true"><path d="M4.6 1.5L1.4 4.5L4.6 7.5"/></svg></button>
      <span id="cal-title"></span>
      <button type="button" id="cal-next" aria-label="다음 달"><svg class="ico" width="6" height="9" viewBox="0 0 6 9" aria-hidden="true"><path d="M1.4 1.5L4.6 4.5L1.4 7.5"/></svg></button>
    </div>
    <div id="calendar">
      <div class="cal-grid" id="cal-weeks"></div>
      <div class="cal-grid" id="cal-days"></div>
      <button type="button" id="collapse-btn" aria-label="달력 접기">
        <span class="arrow"><svg class="ico" width="6" height="9" viewBox="0 0 6 9" aria-hidden="true"><path d="M4.6 1.5L1.4 4.5L4.6 7.5"/></svg></span>
      </button>
    </div>

    <div id="main-categories"></div>
    <div id="undo-toast"><span id="undo-msg"></span><button type="button" id="undo-btn">실행 취소</button></div>
    <div id="move-undone-wrap" class="hidden"><button type="button" id="move-undone-btn"></button></div>

    <div id="sync-modal" class="sheet">
      <div class="modal-box">
        <label for="sync-url">링크</label>
        <input type="text" id="sync-url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="sync-row">
          <button type="button" id="sync-up-btn">업로드</button>
          <button type="button" id="sync-down-btn">다운로드</button>
        </div>
        <p id="sync-status"></p>
      </div>
    </div>
    <div id="todo-modal" class="sheet">
      <div class="modal-box">
        <label for="todo-title">투두 제목<span class="req">*</span></label>
        <input type="text" id="todo-title">

  <script>
    var colors = ['#BA664C', '#262D82', '#DBB114', '#498059', '#7C33B0'];
    var categories = [];
    var archive = [];
    var selectedColor = null;
    var selectedIndex = null;
    var editingIndex = null;
    var todoCategoryIndex = null;
    var editingTodoIndex = null;
    var actionTodo = null;
    var pendingDelete = null;
    var pendingEdit = null;
    var untilMin = '';
    var sleeps = {};
    var diaries = {};
    try { diaries = JSON.parse(localStorage.getItem('todo-diaries') || '{}') || {}; } catch (err) { diaries = {}; }
    function persistDiaries() {
      try { localStorage.setItem('todo-diaries', JSON.stringify(diaries)); } catch (err) {}
    }
    function loadDiary() {
      document.getElementById('diary-text').value = diaries[fmtDate(selectedDate)] || '';
    }

    var ICONS = {
      schedule: { label: '일정', svg: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>' },
      transport: { label: '교통', svg: '<rect x="4.5" y="3.5" width="15" height="14" rx="3"/><path d="M4.5 10.5h15M7 17.5v3M17 17.5v3"/><circle cx="8.5" cy="14" r="0.6"/><circle cx="15.5" cy="14" r="0.6"/>' },
      study: { label: '공부', svg: '<path d="M12 6.5C10.5 5.3 8.2 5 4 5v13c4.2 0 6.5.3 8 1.5 1.5-1.2 3.8-1.5 8-1.5V5c-4.2 0-6.5.3-8 1.5zM12 6.5v13"/>' },
      todo: { label: '할일', svg: '<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.4l2.7 2.7 4.7-5.4"/>' }
    };
    var ICON_KEYS = ['schedule', 'transport', 'study', 'todo'];
    function iconSvg(key, size) {
      return '<svg class="ico" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[key].svg + '</svg>';
    }
    function catMark(cat) {
      var el = document.createElement('span');
      if (cat.icon && ICONS[cat.icon]) {
        el.className = 'cat-icon';
        el.style.color = cat.color;
        el.innerHTML = iconSvg(cat.icon, 18);
      } else {
        el.className = 'dot';
        el.style.background = cat.color;
      }
      return el;
    }
    var selectedIcon = null;
    function renderIconPicker() {
      var box = document.getElementById('icon-picker');
      box.innerHTML = '';
      ICON_KEYS.forEach(function (key) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'icon-opt' + (selectedIcon === key ? ' selected' : '');
        b.style.color = '';
        b.innerHTML = iconSvg(key, 24) + '<span>' + ICONS[key].label + '</span>';
        b.querySelector('svg').style.color = selectedColor || '#333';
        b.addEventListener('click', function () {
          selectedIcon = key;
          renderIconPicker();
        });
        box.appendChild(b);
      });
    }
    var palette = document.getElementById('palette');
    colors.forEach(function (c) {
      var s = document.createElement('button');
      s.type = 'button';
      s.className = 'swatch';
      s.style.background = c;
      s.addEventListener('click', function () {
        selectedColor = c;
        palette.querySelectorAll('.swatch').forEach(function (el) { el.classList.remove('selected'); });
        s.classList.add('selected');
        renderIconPicker();
      });
      palette.appendChild(s);
    });

    function fmtDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function parseDate(str) {
      var p = str.split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    function occursOn(todo, ds) {
      if (todo.excluded && todo.excluded[ds]) return false;
      if (ds === todo.date) return true;
      if (!todo.repeatDays.length || !todo.repeatUntil) return false;
      if (ds <= todo.date || ds > todo.repeatUntil) return false;
      return todo.repeatDays.indexOf(parseDate(ds).getDay()) !== -1;
    }
    var repeatDaysEl = document.getElementById('repeat-days');
    ['일','월','화','수','목','금','토'].forEach(function (name, idx) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'day-chip';
      chip.dataset.day = idx;
      chip.textContent = name;
      chip.addEventListener('click', function () { chip.classList.toggle('selected'); });
      repeatDaysEl.appendChild(chip);
    });
    function getRepeatDays() {
      var days = [];
      repeatDaysEl.querySelectorAll('.day-chip.selected').forEach(function (c) { days.push(Number(c.dataset.day)); });
      return days;
    }
    function setRepeatDays(days) {
      repeatDaysEl.querySelectorAll('.day-chip').forEach(function (c) {
        c.classList.toggle('selected', days.indexOf(Number(c.dataset.day)) !== -1);
      });
    }

    var lastDragEnd = 0;
    function attachDrag(item, group, ci) {
      var timer = null, dragging = false, startX = 0, startY = 0, grabOffset = 0, pid = null;
      function place(desiredTop) {
        item.style.transform = 'none';
        var layoutTop = item.getBoundingClientRect().top;
        item.style.transform = 'translateY(' + (desiredTop - layoutTop) + 'px)';
      }
      function move(desiredTop) {
        place(desiredTop);
        var center = desiredTop + item.offsetHeight / 2;
        var prev = item.previousElementSibling;
        while (prev && prev.classList.contains('todo-item')) {
          var pr = prev.getBoundingClientRect();
          if (center < pr.top + pr.height / 2) {
            item.parentNode.insertBefore(item, prev);
            prev = item.previousElementSibling;
          } else break;
        }
        var next = item.nextElementSibling;
        while (next && next.classList.contains('todo-item')) {
          var nr = next.getBoundingClientRect();
          if (center > nr.top + nr.height / 2) {
            item.parentNode.insertBefore(next, item);
            next = item.nextElementSibling;
          } else break;
        }
        place(desiredTop);
      }
      function finish(commit) {
        clearTimeout(timer);
        timer = null;
        if (!dragging) return;
        dragging = false;
        lastDragEnd = Date.now();
        try { item.releasePointerCapture(pid); } catch (err) {}
        if (commit) {
          var order = Array.prototype.map.call(group.querySelectorAll('.todo-item'), function (el) { return Number(el.dataset.ti); });
          var slots = order.slice().sort(function (a, b) { return a - b; });
          var todos = categories[ci].todos;
          var orig = todos.slice();
          order.forEach(function (ti, k) { todos[slots[k]] = orig[ti]; });
        }
        renderCategories();
      }
      item.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      item.addEventListener('touchmove', function (e) { if (dragging) e.preventDefault(); }, { passive: false });
      item.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.todo-check')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        startX = e.clientX;
        startY = e.clientY;
        pid = e.pointerId;
        clearTimeout(timer);
        timer = setTimeout(function () {
          timer = null;
          dragging = true;
          grabOffset = startY - item.getBoundingClientRect().top;
          item.classList.add('dragging');
          try { item.setPointerCapture(pid); } catch (err) {}
        }, 400);
      });
      item.addEventListener('pointermove', function (e) {
        if (!dragging) {
          if (timer && (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8)) {
            clearTimeout(timer);
            timer = null;
          }
          return;
        }
        move(e.clientY - grabOffset);
      });
      item.addEventListener('pointerup', function () { finish(true); });
      item.addEventListener('pointercancel', function () { finish(false); });
    }

    function snapshotItems() {
      var map = {};
      document.querySelectorAll('#main-categories .todo-item').forEach(function (el) {
        map[el.dataset.key] = el.getBoundingClientRect().top;
      });
      return map;
    }
    function animateItems(before) {
      var moving = [];
      document.querySelectorAll('#main-categories .todo-item').forEach(function (el) {
        var old = before[el.dataset.key];
        if (old === undefined) return;
        var dy = old - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) return;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        moving.push(el);
      });
      if (!moving.length) return;
      void document.body.offsetHeight;
      moving.forEach(function (el) {
        el.style.transition = 'transform 0.35s ease';
        el.style.transform = '';
        el.addEventListener('transitionend', function h() {
          el.style.transition = '';
          el.removeEventListener('transitionend', h);
        });
      });
    }
    function nearestPaletteColor(hex) {
      function rgb(h) { return [0, 1, 2].map(function (q) { return parseInt(h.slice(1 + q * 2, 3 + q * 2), 16); }); }
      var a = rgb(hex), best = colors[0], bd = Infinity;
      colors.forEach(function (c) {
        var b = rgb(c);
        var d = Math.pow(a[0] - b[0], 2) + Math.pow(a[1] - b[1], 2) + Math.pow(a[2] - b[2], 2);
        if (d < bd) { bd = d; best = c; }
      });
      return best;
    }
    function renderCategories() {
      categories.forEach(function (cat) {
        if (colors.indexOf(cat.color) === -1) cat.color = nearestPaletteColor(cat.color);
      });
      var list = document.getElementById('category-list');
      list.innerHTML = '';
      categories.forEach(function (cat, i) {
        if (cat.completed) return;
        var li = document.createElement('li');
        li.addEventListener('click', function () {
          selectedIndex = i;
          document.getElementById('action-modal').classList.add('open');
        });
        var dot = catMark(cat);
        var name = document.createElement('span');
        name.textContent = cat.title;
        li.appendChild(dot);
        li.appendChild(name);
        list.appendChild(li);
      });
      var pills = document.getElementById('main-categories');
      pills.innerHTML = '';
      categories.forEach(function (cat, i) {
        var pill = document.createElement('div');
        pill.className = 'cat-pill';

    function saveTodoImage() {
      var ds = fmtDate(selectedDate);
      var groups = [];
      categories.forEach(function (cat) {
        var list = cat.todos.filter(function (t) { return occursOn(t, ds); });
        list = list.filter(function (t) { return !t.doneDates[ds]; }).concat(list.filter(function (t) { return t.doneDates[ds]; }));
        if (list.length) groups.push({ cat: cat, todos: list });
      });
      var diary = (diaries[ds] || '').trim();
      if (!groups.length && !diary) { alert('저장할 투두나 일기가 없어요.'); return; }
      var scale = 2, W = 360, pad = 20, font = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
      var meas = document.createElement('canvas').getContext('2d');
      function wrap(text, size, maxW) {
        meas.font = size + 'px ' + font;
        var lines = [];
        String(text).split('\n').forEach(function (para) {
          var cur = '';
          Array.from(para).forEach(function (ch) {
            if (meas.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;
          });
          lines.push(cur);
        });
        return lines;
      }
      var textX = pad + 20 + 10 + 20, textW = W - textX - pad;
      var layout = [], y = pad;
      var dObj = parseDate(ds);
      var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      var heading = dObj.getFullYear() + '. ' + (dObj.getMonth() + 1) + '. ' + dObj.getDate() + ' (' + dayNames[dObj.getDay()] + ')';
      y += 22 + 18;
      groups.forEach(function (g) {
        var g0 = { y: y, cat: g.cat, items: [] };
        y += 32 + 6;
        g.todos.forEach(function (t) {
          var it = { y: y + 8, t: t, done: !!t.doneDates[ds] };
          it.titleLines = wrap(t.title, 14, textW);
          var h = it.titleLines.length * 20;
          if (t.start) { it.time = t.end ? t.start + '-' + t.end : t.start; h += 18; }
          if (t.memo) { it.memoLines = wrap(t.memo, 12, textW); h += it.memoLines.length * 17; }
          it.h = h;
          y += h + 16;
          g0.items.push(it);
        });
        y += 10;
        layout.push(g0);
      });
      y += pad - 10;
      var TW = diary ? W * 2 : W;
      var diaryLines = diary ? wrap(diary, 14, W - pad * 2) : [];
      if (diary) y = Math.max(y, pad + 22 + 18 + diaryLines.length * 22 + pad);
      var cv = document.createElement('canvas');
      cv.width = TW * scale; cv.height = y * scale;
      var c = cv.getContext('2d');
      c.scale(scale, scale);
      c.fillStyle = '#fff'; c.fillRect(0, 0, TW, y);
      c.textBaseline = 'alphabetic';
      c.fillStyle = '#000'; c.font = '600 18px ' + font;
      c.fillText(heading, pad, pad + 18);
      if (diary) {
        c.fillStyle = '#e5e7eb'; c.fillRect(W, pad, 1, y - pad * 2);
        c.fillStyle = '#000'; c.font = '600 18px ' + font;
        c.fillText('일기', W + pad, pad + 18);
        c.fillStyle = '#333'; c.font = '14px ' + font;
        diaryLines.forEach(function (ln, k) { c.fillText(ln, W + pad, pad + 22 + 18 + k * 22 + 15); });
      }
      layout.forEach(function (g) {
        c.fillStyle = '#e5e7eb';
        c.beginPath(); c.arc(pad + 16, g.y + 16, 16, Math.PI / 2, Math.PI * 1.5); c.arc(W - pad - 16, g.y + 16, 16, -Math.PI / 2, Math.PI / 2); c.closePath(); c.fill();
        c.fillStyle = g.cat.color;
        c.beginPath(); c.arc(pad + 16 + 4, g.y + 16, 8, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#000'; c.font = '15px ' + font;
        c.fillText(g.cat.title, pad + 38, g.y + 21);
        g.items.forEach(function (it) {
          var cx = pad + 20 + 10, ty = it.y;
          c.beginPath(); c.arc(cx, ty + 10, 9, 0, Math.PI * 2);
          if (it.done) { c.fillStyle = g.cat.color; c.fill(); }
          c.lineWidth = 1.5; c.strokeStyle = g.cat.color; c.stroke();
          var ly = ty;
          c.fillStyle = it.done ? '#9ca3af' : '#000'; c.font = '14px ' + font;
          it.titleLines.forEach(function (ln) {
            c.fillText(ln, textX, ly + 15);
            if (it.done) { c.fillRect(textX, ly + 10, c.measureText(ln).width, 1); }
            ly += 20;
          });
          c.fillStyle = '#6b7280'; c.font = '12px ' + font;
          if (it.time) { c.fillText(it.time, textX, ly + 13); ly += 18; }
          if (it.memoLines) it.memoLines.forEach(function (ln) { c.fillText(ln, textX, ly + 13); ly += 17; });
        });
      });
      cv.toBlob(function (blob) {
        if (!blob) return;
        var name = 'todo-' + ds + '.png';
        var file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file] }).catch(function () {});
          return;
        }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      }, 'image/png');
    }

    function searchDates(todo) {
      var res = {};
      res[todo.date] = true;
      if (todo.repeatDays && todo.repeatDays.length && todo.repeatUntil) {
        var d = parseDate(todo.date);
        d.setDate(d.getDate() + 1);
        var guard = 0;
        while (fmtDate(d) <= todo.repeatUntil && guard++ < 3660) {
          if (todo.repeatDays.indexOf(d.getDay()) !== -1) res[fmtDate(d)] = true;
          d.setDate(d.getDate() + 1);
        }
      }
      Object.keys(todo.excluded || {}).forEach(function (k) { if (todo.excluded[k]) delete res[k]; });
      return Object.keys(res);
    }

    function renderSearch() {

      var groups = {}, order = [];
      function add(cat, todo, archived) {
        if ((todo.title || '').toLowerCase().indexOf(q) === -1 && (todo.memo || '').toLowerCase().indexOf(q) === -1) return;
        var key = categories.indexOf(cat) + '|' + todo.title + '|' + (archived ? 'a' : 'n');
        if (!groups[key]) { groups[key] = { cat: cat, title: todo.title, archived: archived, dates: {} }; order.push(key); }
        if (archived) return;
        searchDates(todo).forEach(function (ds) {
          var done = !!(todo.doneDates && todo.doneDates[ds]);
          groups[key].dates[ds] = groups[key].dates[ds] || done;
        });
      }
      categories.forEach(function (cat) { cat.todos.forEach(function (t) { add(cat, t, false); }); });
      archive.forEach(function (a) { add(a.cat, a, true); });
      if (!order.length) {
        var empty = document.createElement('div');
        empty.className = 'sr-empty';
        empty.textContent = '검색 결과가 없어요';

        return;
      }
      var dn = ['일', '월', '화', '수', '목', '금', '토'];
      order.forEach(function (key) {
        var g = groups[key];

        var dot;

        head.appendChild(dot);

        if (g.archived) {
          var tag = document.createElement('span');
          tag.className = 'sr-tag';
          tag.textContent = '보관함';
          head.appendChild(tag);

        item.appendChild(head);
        var dates = Object.keys(g.dates).sort();
        if (!g.archived) {
          var cnt = document.createElement('div');
          cnt.className = 'sr-count';
          cnt.textContent = dates.length + '일';
          item.appendChild(cnt);
          var wrap = document.createElement('div');
          wrap.className = 'sr-dates';
          dates.forEach(function (ds) {
            var d = parseDate(ds);

    (function () {

          setId(t, r.id);
          t.title = r.title; t.memo = r.memo; t.start = r.start; t.end = r.end; t.date = r.date;
          t.repeatDays = r.repeatDays ? r.repeatDays.split(',').map(Number).filter(function (n) { return n >= 0 && n <= 6; }) : [];
          t.repeatUntil = r.repeatUntil;
          t.doneDates = toMap(r.doneDates); t.excluded = toMap(r.excluded);
          c.todos.push(t);
        });
        categories.length = 0;
        catList.forEach(function (c) { categories.push(c); });

        var arch = [];
        liveSorted('archive').forEach(function (r) {
          var c = catMap[r.categoryId];
          if (!c) return;
          var a = oldArch[r.id] || {};
          setId(a, r.id);
          a.title = r.title; a.memo = r.memo; a.start = r.start; a.end = r.end; a.cat = c;
          arch.push(a);
        });
        archive = arch;

        Object.keys(sleeps).forEach(function (k) { delete sleeps[k]; });
        liveSorted('sleeps').forEach(function (r) { sleeps[r.date] = { s: Number(r.startMin), e: Number(r.endMin) }; });
        Object.keys(diaries).forEach(function (k) { delete diaries[k]; });
        liveSorted('diaries').forEach(function (r) { diaries[r.date] = r.text; });
        persistDiaries();

        renderCalendar();
        renderCategories();
        renderArchive();
      }

      function norm(tb, r) {
        var o = {};
        FIELDS[tb].concat(['updatedAt', 'deleted']).forEach(function (f) { o[f] = str(r[f]); });
        if (o.deleted && o.deleted !== '1') o.deleted = '1';
        return o;
      }

      // ----- UI -----
      var modal = document.getElementById('sync-modal');
      var urlIn = document.getElementById('sync-url');
      var statusEl = document.getElementById('sync-status');
      var upBtn = document.getElementById('sync-up-btn');
      var downBtn = document.getElementById('sync-down-btn');
      var busy = false;
      function setStatus(msg, err) { statusEl.textContent = msg; statusEl.style.color = err ? '#ef4444' : '#6b7280'; }
      function setBusy(b) { busy = b; upBtn.disabled = b; downBtn.disabled = b; }
      function readUrl() {
        var u = urlIn.value.trim();
        if (!u) { setStatus('링크를 입력해 주세요', true); urlIn.focus(); return null; }
        if (!/^https:\/\/script\.google\.com\//.test(u)) { setStatus('Apps Script 링크 형식이 아닙니다', true); return null; }
        url = u; lsSet(LS.url, u);
        return u;
      }
      function request(body) {
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        }).then(function (res) { return res.json(); }).then(function (res) {
          if (!res || !res.ok) throw new Error(res && res.error || 'error');
          return res;
        });
      }

      upBtn.addEventListener('click', function () {
        if (busy || !readUrl()) return;
        if (!confirm('이 기기의 데이터로 시트를 덮어씁니다.\n업로드할까요?')) return;
        scan();
        var rows = {};
        Object.keys(TABLES).forEach(function (tb) {
          rows[tb] = Object.keys(store[tb]).map(function (k) { return store[tb][k]; })
            .filter(function (r) { return !r.deleted; })
            .map(function (r) { return norm(tb, r); });
        });
        setBusy(true); setStatus('업로드 중…');
        request({ action: 'upload', rows: rows }).then(function () {
          saveBase();
          setStatus('업로드 완료 · ' + hhmm());
        }).catch(function (err) {
          console.warn(err); setStatus('업로드 실패: ' + err.message, true);
        }).then(function () { setBusy(false); });
      });

      downBtn.addEventListener('click', function () {
        if (busy || !readUrl()) return;
        if (!confirm('시트의 데이터로 이 기기를 덮어씁니다.\n다운로드할까요?')) return;
        setBusy(true); setStatus('다운로드 중…');
        request({ action: 'pull' }).then(function (res) {
          Object.keys(TABLES).forEach(function (tb) {
            var m = {};
            ((res.rows && res.rows[tb]) || []).forEach(function (raw) {
              var r = norm(tb, raw), k = r[TABLES[tb]];
              if (!k || r.deleted) return;
              r._h = hashOf(tb, r);
              m[k] = r;
            });
            store[tb] = m;
          });
          saveStore();
          saveBase();
          apply();
          setStatus('다운로드 완료 · ' + hhmm());
        }).catch(function (err) {
          console.warn(err); setStatus('다운로드 실패: ' + err.message, true);
        }).then(function () { setBusy(false); });
      });

      document.getElementById('sync-btn').addEventListener('click', function () {
        document.getElementById('mini-menu').classList.remove('open');
        urlIn.value = url;
        setStatus('');
        modal.classList.add('open');
      });
      urlIn.addEventListener('change', function () {
        var u = urlIn.value.trim();
        if (!u || /^https:\/\/script\.google\.com\//.test(u)) { url = u; lsSet(LS.url, u); }
      });

      // ----- 자동 동기화: 시트 우선 -----
      function uiBusy() {
        if (document.querySelector('.sheet.open, .popup.open')) return true;
        var a = document.activeElement;
        return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
      }
      function pullRemote() {
        return request({ action: 'pull' }).then(function (res) {
          var R = {};
          Object.keys(TABLES).forEach(function (tb) {
            R[tb] = {};
            ((res.rows && res.rows[tb]) || []).forEach(function (raw) {
              var r = norm(tb, raw), k = r[TABLES[tb]];
              if (!k || r.deleted) return;
              r._h = hashOf(tb, r);
              R[tb][k] = r;
            });
          });
          return R;
        });
      }
      function autoSync() {
        if (!url || busy) return;
        setBusy(true);
        setStatus('자동 동기화 중…');
        pullRemote().then(function (R) {
          scan();
          var result = {}, localChanged = false, remoteChanged = false;
          Object.keys(TABLES).forEach(function (tb) {
            var st = store[tb], b = base[tb] || {}, out = {}, keys = {};
            [st, R[tb], b].forEach(function (m) { Object.keys(m).forEach(function (k) { keys[k] = 1; }); });
            Object.keys(keys).forEach(function (k) {
              var L = st[k] && !st[k].deleted ? st[k] : null;
              var Rr = R[tb][k] || null, B = b[k], pick;
              if (Rr) pick = (B === undefined || Rr._h !== B) ? Rr : L; // 시트가 바뀌었으면 시트 우선
              else pick = (B === undefined) ? L : null;                 // 시트에서 지워졌으면 삭제
              if (pick) out[k] = pick;
              if ((L ? L._h : null) !== (pick ? pick._h : null)) localChanged = true;
              if ((Rr ? Rr._h : null) !== (pick ? pick._h : null)) remoteChanged = true;
            });
            result[tb] = out;
          });
          store = result;
          saveStore();
          if (localChanged) apply();
          if (!remoteChanged) { saveBase(); return; }
          var rows = {};
          Object.keys(TABLES).forEach(function (tb) {
            rows[tb] = Object.keys(result[tb]).map(function (k) { return norm(tb, result[tb][k]); });
          });
          return request({ action: 'upload', rows: rows }).then(function () { saveBase(); });
        }).then(function () {
          setStatus('자동 동기화 완료 · ' + hhmm());
        }).catch(function (err) {
          dirty = true;
          console.warn('auto sync failed', err);
          setStatus('자동 동기화 실패: ' + err.message, true);
        }).then(function () { setBusy(false); });
      }

      var dirty = false, lastChange = 0;
      if (hadStore) apply(); else scan();
      setInterval(function () {
        if (scan()) { dirty = true; lastChange = Date.now(); }
        if (url && dirty && !busy && Date.now() - lastChange >= 3000 && !uiBusy()) { dirty = false; autoSync(); }
      }, 1000);
      setInterval(function () { if (url && !document.hidden && !busy && !uiBusy()) autoSync(); }, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!url || busy) return;
        if (document.hidden) { scan(); if (dirty) { dirty = false; autoSync(); } }
        else if (!uiBusy()) autoSync();
      });
      window.addEventListener('online', function () { if (url && !busy && !uiBusy()) autoSync(); });
      if (url) setTimeout(function () { if (!uiBusy()) autoSync(); }, 500);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
